# tag_map.yaml — canonical label -> list of raw lastfm/spotify-genre tag patterns (lowercase, exact match)
# Six layers. For singular layers (genre, subgenre, rhythm) the highest-weighted match wins.
# For multi-value layers (production_dna, texture, lineage) all matches are kept.
# Edit freely. Add new raw tags under the right canonical.

